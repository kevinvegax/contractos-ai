services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DEVELOP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DEVELOP_POSTGRES_PASSWORD}
    ports:
      - "${DEVELOP_POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${DEVELOP_PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${DEVELOP_PGADMIN_PASSWORD}
    ports:
      - "${DEVELOP_PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
      
volumes:
  postgres_data:
  pgadmin_data:
